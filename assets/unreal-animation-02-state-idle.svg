<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="#151515"/><text x="50" y="60" fill="#f3eee4" font-size="32" font-family="Arial" font-weight="700">02 · Créer le State « Idle »</text><text x="50" y="94" fill="#aaa" font-size="18" font-family="Arial">Ajouter un State, le renommer Idle, puis le relier à Entry.</text><rect x="110" y="190" width="210" height="110" rx="14" fill="#3a3a3a" stroke="#777" stroke-width="3"/><text x="215" y="255" text-anchor="middle" fill="#fff" font-size="25" font-family="Arial" font-weight="700">Entry</text><circle cx="320" cy="245" r="9" fill="#fff"/><path d="M330 245H690" stroke="#fff" stroke-width="7"/><polygon points="690,245 665,230 665,260" fill="#fff"/><rect x="700" y="175" width="270" height="140" rx="14" fill="#d89045" stroke="#f3eee4" stroke-width="3"/><text x="835" y="255" text-anchor="middle" fill="#171717" font-size="28" font-family="Arial" font-weight="700">Idle</text><text x="835" y="290" text-anchor="middle" fill="#171717" font-size="17" font-family="Arial">State</text><rect x="50" y="410" width="1100" height="70" rx="10" fill="#f3eee4"/><text x="600" y="455" text-anchor="middle" fill="#171717" font-size="21" font-family="Arial" font-weight="700">À retenir : Entry → Idle</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610"><rect width="1200" height="610" fill="#151515"/><text x="50" y="58" fill="#f3eee4" font-size="31" font-family="Arial" font-weight="700">06 · Remplacer le Mesh et récupérer les valeurs de déplacement</text><text x="50" y="94" fill="#aaa" font-size="18" font-family="Arial">Utiliser le nouveau Mesh puis consulter Character Movement dans Details.</text><rect x="70" y="145" width="330" height="350" rx="14" fill="#202020" stroke="#454545" stroke-width="2"/><text x="105" y="185" fill="#f3eee4" font-size="21" font-family="Arial" font-weight="700">Character</text><text x="105" y="220" fill="#aaa" font-size="17" font-family="Arial">Components → Character</text><rect x="100" y="260" width="270" height="70" rx="8" fill="#151515"/><text x="235" y="303" text-anchor="middle" fill="#fff" font-size="19" font-family="Arial" font-weight="700">Mesh</text><text x="235" y="345" text-anchor="middle" fill="#f3eee4" font-size="16" font-family="Arial">→ sélectionner le nouveau Skeletal Mesh</text><path d="M420 320H650" stroke="#fff" stroke-width="6"/><polygon points="650,320 625,305 625,335" fill="#fff"/><rect x="670" y="145" width="460" height="350" rx="14" fill="#202020" stroke="#454545" stroke-width="2"/><text x="705" y="185" fill="#f3eee4" font-size="21" font-family="Arial" font-weight="700">Details → Character Movement</text><text x="705" y="230" fill="#aaa" font-size="17" font-family="Arial">Walking</text><rect x="705" y="255" width="390" height="55" rx="8" fill="#151515"/><text x="725" y="290" fill="#fff" font-size="17" font-family="Arial">Max Walk Speed</text><text x="1070" y="290" text-anchor="end" fill="#f3eee4" font-size="18" font-family="Arial" font-weight="700">ex. 600</text><rect x="705" y="330" width="390" height="55" rx="8" fill="#151515"/><text x="725" y="365" fill="#fff" font-size="17" font-family="Arial">Walking / movement values</text><text x="1070" y="365" text-anchor="end" fill="#f3eee4" font-size="17" font-family="Arial" font-weight="700">à reporter</text><text x="705" y="425" fill="#aaa" font-size="16" font-family="Arial">Ces valeurs servent à alimenter la logique</text><text x="705" y="450" fill="#aaa" font-size="16" font-family="Arial">d'animation, notamment la Speed.</text><rect x="50" y="525" width="1100" height="55" rx="9" fill="#f3eee4"/><text x="600" y="560" text-anchor="middle" fill="#171717" font-size="18" font-family="Arial" font-weight="700">Important : Max Walk Speed = vitesse maximale au sol du Character Movement.</text></svg>
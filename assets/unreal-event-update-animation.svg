<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Unreal Animation — Event Blueprint Update Animation</title>
<desc id="desc">Schéma du calcul de Ground Speed dans l'Event Graph d'un Animation Blueprint : Event Blueprint Update Animation, Try Get Pawn Owner, Get Velocity, Vector Length puis Set Ground Speed.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#24272b" stroke-width="1"/></pattern>
  <linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#111a29"/><stop offset="1" stop-color="#182b45"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="1400" height="820" fill="#101214"/>
<rect width="1400" height="820" fill="url(#grid)"/>
<rect x="0" y="0" width="1400" height="118" fill="url(#head)"/>
<text x="42" y="48" fill="#f3eee4" font-size="32" font-weight="800">Animation — Event Blueprint Update Animation</text>
<text x="42" y="84" fill="#bfc5cf" font-size="19">Calculer la vitesse du personnage pour piloter le Blend Space 1D</text>
<rect x="1035" y="22" width="320" height="72" rx="12" fill="#f3eee4"/>
<text x="1057" y="49" fill="#171717" font-size="17" font-weight="800">À RETENIR</text>
<text x="1057" y="73" fill="#333" font-size="14">Update Animation se déclenche à chaque frame.</text>

<rect x="34" y="146" width="300" height="600" rx="14" fill="#171a1d" stroke="#39414a" filter="url(#shadow)"/>
<text x="58" y="181" fill="#f3eee4" font-size="22" font-weight="800">1 → 5 · Workflow</text>
<line x1="58" y1="200" x2="310" y2="200" stroke="#3d454e"/>
<text x="58" y="239" fill="#fff" font-size="18" font-weight="800">1. Update Animation</text>
<text x="58" y="265" fill="#aaa" font-size="15">Lance la mise à jour des variables.</text>
<text x="58" y="321" fill="#fff" font-size="18" font-weight="800">2. Try Get Pawn Owner</text>
<text x="58" y="347" fill="#aaa" font-size="15">Récupère le personnage possédé.</text>
<text x="58" y="403" fill="#fff" font-size="18" font-weight="800">3. Get Velocity</text>
<text x="58" y="429" fill="#aaa" font-size="15">Récupère le vecteur de vitesse.</text>
<text x="58" y="485" fill="#fff" font-size="18" font-weight="800">4. Vector Length</text>
<text x="58" y="511" fill="#aaa" font-size="15">Transforme le vecteur en valeur.</text>
<text x="58" y="567" fill="#fff" font-size="18" font-weight="800">5. Set Ground Speed</text>
<text x="58" y="593" fill="#aaa" font-size="15">Stocke la vitesse pour le Blend Space.</text>
<rect x="58" y="645" width="252" height="70" rx="10" fill="#20252b" stroke="#f3eee4"/>
<text x="74" y="673" fill="#f3eee4" font-size="15" font-weight="800">Formule</text>
<text x="74" y="699" fill="#fff" font-size="16">Ground Speed = |Velocity|</text>

<rect x="365" y="182" width="1000" height="340" rx="16" fill="#17191b" stroke="#454a50"/>
<text x="397" y="219" fill="#aaa" font-size="15">ABP_Y_Bot → EventGraph</text>

<rect x="398" y="278" width="205" height="108" rx="10" fill="#151515" stroke="#a52a2a" stroke-width="3"/>
<rect x="398" y="278" width="205" height="34" rx="10" fill="#9d2c2c"/>
<text x="415" y="302" fill="#fff" font-size="15" font-weight="800">Event Blueprint</text>
<text x="415" y="324" fill="#fff" font-size="15" font-weight="800">Update Animation</text>
<circle cx="600" cy="347" r="7" fill="#fff"/>
<text x="416" y="360" fill="#aaa" font-size="13">Delta Time X</text>

<rect x="642" y="274" width="190" height="116" rx="10" fill="#17251b" stroke="#4caf50" stroke-width="2"/>
<text x="660" y="305" fill="#b8f5bf" font-size="16" font-weight="800">Try Get Pawn Owner</text>
<text x="660" y="331" fill="#aaa" font-size="13">Target: self</text>
<text x="660" y="359" fill="#ddd" font-size="13">Return Value</text>
<circle cx="827" cy="359" r="7" fill="#28a7df"/>

<rect x="875" y="274" width="170" height="116" rx="10" fill="#17251b" stroke="#4caf50" stroke-width="2"/>
<text x="894" y="305" fill="#b8f5bf" font-size="17" font-weight="800">Get Velocity</text>
<text x="894" y="331" fill="#aaa" font-size="13">Target is Actor</text>
<text x="894" y="359" fill="#ddd" font-size="13">Return Value</text>
<circle cx="1040" cy="359" r="7" fill="#e8b82e"/>

<rect x="1087" y="274" width="145" height="116" rx="10" fill="#17251b" stroke="#4caf50" stroke-width="2"/>
<text x="1104" y="305" fill="#b8f5bf" font-size="17" font-weight="800">Vector Length</text>
<text x="1104" y="333" fill="#aaa" font-size="13">A → valeur</text>
<text x="1104" y="359" fill="#ddd" font-size="13">Return Value</text>
<circle cx="1226" cy="359" r="7" fill="#42c96b"/>

<rect x="1272" y="274" width="72" height="116" rx="10" fill="#17301d" stroke="#55c96b" stroke-width="2"/>
<text x="1308" y="307" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">SET</text>
<text x="1308" y="337" text-anchor="middle" fill="#aaa" font-size="12">Ground</text>
<text x="1308" y="354" text-anchor="middle" fill="#aaa" font-size="12">Speed</text>
<circle cx="1278" cy="359" r="7" fill="#42c96b"/>

<path d="M603 347 H642" stroke="#fff" stroke-width="4"/>
<path d="M832 359 H875" stroke="#28a7df" stroke-width="4"/>
<path d="M1045 359 H1087" stroke="#e8b82e" stroke-width="4"/>
<path d="M1232 359 H1272" stroke="#42c96b" stroke-width="4"/>

<circle cx="425" cy="253" r="20" fill="#f3eee4"/><text x="425" y="260" text-anchor="middle" fill="#171717" font-size="16" font-weight="900">1</text>
<circle cx="667" cy="249" r="20" fill="#f3eee4"/><text x="667" y="256" text-anchor="middle" fill="#171717" font-size="16" font-weight="900">2</text>
<circle cx="900" cy="249" r="20" fill="#f3eee4"/><text x="900" y="256" text-anchor="middle" fill="#171717" font-size="16" font-weight="900">3</text>
<circle cx="1105" cy="249" r="20" fill="#f3eee4"/><text x="1105" y="256" text-anchor="middle" fill="#171717" font-size="16" font-weight="900">4</text>
<circle cx="1290" cy="249" r="20" fill="#f3eee4"/><text x="1290" y="256" text-anchor="middle" fill="#171717" font-size="16" font-weight="900">5</text>

<rect x="365" y="550" width="1000" height="196" rx="16" fill="#171a1d" stroke="#454a50"/>
<text x="397" y="590" fill="#f3eee4" font-size="22" font-weight="800">Pourquoi on fait ça ?</text>
<text x="397" y="625" fill="#ddd" font-size="17">Velocity est un vecteur (X, Y, Z). Vector Length calcule sa magnitude :</text>
<rect x="397" y="645" width="355" height="50" rx="9" fill="#20252b"/>
<text x="420" y="677" fill="#fff" font-size="19" font-weight="800">Speed = √(X² + Y² + Z²)</text>
<text x="790" y="625" fill="#ddd" font-size="17">Ground Speed devient une variable Float.</text>
<text x="790" y="655" fill="#ddd" font-size="17">Elle peut ensuite alimenter l'axe Speed</text>
<text x="790" y="683" fill="#f3eee4" font-size="17" font-weight="800">du Blend Space 1D.</text>
<text x="790" y="715" fill="#aaa" font-size="14">Exemple : 0 = Idle · vitesse intermédiaire = Walk · vitesse élevée = Run</text>
</svg>
<path d="M770 510 C810 510 820 350 880 350" stroke="#20a9e0" stroke-width="4"/>
<path d="M1180 335 H1225" stroke="#fff" stroke-width="4"/>
<path d="M1165 380 C1200 380 1200 380 1225 380" stroke="#20a9e0" stroke-width="4"/>
<path d="M1475 335 H1505" stroke="#fff" stroke-width="4"/>
</g>
<g fill="#fff"><path d="M600 330l-13-8v16z"/><path d="M880 335l-13-8v16z"/><path d="M1225 335l-13-8v16z"/><path d="M1505 335l-13-8v16z"/></g>

<rect x="870" y="500" width="780" height="145" rx="15" fill="#121416" stroke="#45484c"/>
<text x="895" y="535" fill="#f3eee4" font-family="Arial" font-size="23" font-weight="700">À retenir</text>
<text x="895" y="572" fill="#ddd" font-family="Arial" font-size="18">1. Overlap détecte l'acteur → 2. == vérifie que c'est le joueur → 3. Branch valide la condition.</text>
<text x="895" y="605" fill="#ddd" font-family="Arial" font-size="18">4. Get GameMode → 5. Cast → 6. Increase Coin → 7. Destroy Actor.</text>
</svg>
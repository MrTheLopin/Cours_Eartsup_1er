<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#181a1b"/><defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#292b2d"/></pattern></defs><rect width="1200" height="760" fill="url(#g)"/><text x="38" y="50" fill="#f3eee4" font-size="28" font-weight="800">Règles de transition</text><text x="38" y="80" fill="#aaa" font-size="16">Les variables booléennes déterminent si une transition peut être franchie.</text>
<rect x="55" y="125" width="330" height="230" rx="14" fill="#202020" stroke="#3f3f3f"/><text x="78" y="160" fill="#fff" font-size="21" font-weight="800">IdleWalk → Falling</text><rect x="78" y="190" width="130" height="55" rx="10" fill="#303030"/><text x="143" y="224" text-anchor="middle" fill="#fff" font-size="18">Is Falling</text><path d="M208 218H270" stroke="#e44" stroke-width="4"/><rect x="270" y="190" width="85" height="55" rx="10" fill="#303030"/><text x="312" y="224" text-anchor="middle" fill="#fff" font-size="16">Result</text><text x="78" y="280" fill="#f3eee4" font-size="15">Condition : Is Falling = TRUE</text><text x="78" y="308" fill="#aaa" font-size="14">Le personnage commence une chute.</text>
<rect x="435" y="125" width="330" height="230" rx="14" fill="#202020" stroke="#3f3f3f"/><text x="458" y="160" fill="#fff" font-size="21" font-weight="800">Falling → JumpEnd</text><rect x="458" y="190" width="130" height="55" rx="10" fill="#303030"/><text x="523" y="224" text-anchor="middle" fill="#fff" font-size="18">Is Falling</text><path d="M588 218H650" stroke="#e44" stroke-width="4"/><rect x="650" y="190" width="85" height="55" rx="10" fill="#303030"/><text x="692" y="224" text-anchor="middle" fill="#fff" font-size="16">Result</text><text x="458" y="280" fill="#f3eee4" font-size="15">Condition : Is Falling = TRUE</text><text x="458" y="308" fill="#aaa" font-size="14">La logique mène vers la fin du saut.</text>
<rect x="815" y="125" width="330" height="230" rx="14" fill="#202020" stroke="#3f3f3f"/><text x="838" y="160" fill="#fff" font-size="21" font-weight="800">Falling → JumpEnd</text><rect x="838" y="190" width="130" height="55" rx="10" fill="#303030"/><text x="903" y="224" text-anchor="middle" fill="#fff" font-size="18">Is Falling</text><rect x="985" y="190" width="85" height="55" rx="10" fill="#303030"/><text x="1027" y="224" text-anchor="middle" fill="#fff" font-size="16">NOT</text><path d="M968 218H985" stroke="#e44" stroke-width="4"/><path d="M1070 218H1110" stroke="#e44" stroke-width="4"/><text x="838" y="280" fill="#f3eee4" font-size="15">Condition inverse :</text><text x="838" y="306" fill="#fff" font-size="16" font-weight="700">NOT Is Falling = TRUE</text>
<rect x="300" y="430" width="600" height="210" rx="14" fill="#202020" stroke="#f3eee4"/><text x="330" y="470" fill="#f3eee4" font-size="22" font-weight="800">JumpEnd → IdleWalk</text><rect x="330" y="505" width="540" height="65" rx="10" fill="#303030"/><text x="600" y="546" text-anchor="middle" fill="#fff" font-size="18">Can Enter Transition ✓</text><text x="330" y="605" fill="#aaa" font-size="14">Dans la capture fournie, la règle est laissée autorisée. Le State Machine peut donc revenir vers IdleWalk selon le comportement de la transition.</text></svg>